project:
  type: website
  output-dir: docs          # GitHub Pages serves from /docs on the main branch

website:
  title: "Sleep Pod Study — Participant Guide"
  description: "Set-up instructions for the Griffith University mattress topper study (HREC/2026/0662)"
  favicon: images/fitbit-tracker.png
  navbar:
    background: primary
    search: true
    right:
      - text: "Need a hand?"
        href: contact.qmd
  sidebar:
    style: docked
    collapse-level: 1
    contents:
      - text: "Start here"
        href: index.qmd
      - section: "Setting up"
        contents:
          - fitbit.qmd
          - temperature-sensor.qmd
          - mattress-topper.qmd
      - section: "Finishing the study"
        contents:
          - returning-equipment.qmd
      - text: "Need a hand?"
        href: contact.qmd
  page-footer:
    left: "Griffith University · HREC/2026/0662"
    right: "Last updated {{< meta date-modified >}}"
  page-navigation: true

format:
  html:
    theme:
      - cosmo
      - custom.scss
    css: styles.css
    toc: true
    toc-title: "On this page"
    toc-depth: 2
    fontsize: 1.1em          # slightly larger text for older readers
    link-external-newwindow: true
    include-in-header:
      text: |
        <meta name="robots" content="noindex">
    include-after-body:
      text: |
        <script>
        // Contact details are stored encoded and only assembled when a person
        // taps the button, so email-harvesting bots reading the page source
        // don't find them.
        function revealContact(btn){
          var d = btn.dataset;
          var box = btn.nextElementSibling;
          var html = "";
          if (d.n) { html += "<strong>" + atob(d.n) + "</strong><br>"; }
          if (d.p) {
            var ph = atob(d.p);
            html += "Phone: <a href='tel:" + ph.replace(/\s/g,"") + "'>" + ph + "</a><br>";
          }
          if (d.e) {
            var em = atob(d.e);
            html += "Email: <a href='mailto:" + em + "'>" + em + "</a>";
          }
          box.innerHTML = html;
          box.hidden = false;
          btn.remove();
        }
        </script>
